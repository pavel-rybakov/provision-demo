spring:
  application:
    name: provision-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/provision}
    username: ${DB_USERNAME:provision}
    password: ${DB_PASSWORD:provision}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    token-ttl: ${AUTH_TOKEN_TTL:PT24H}
  bootstrap-users:
    enabled: ${BOOTSTRAP_USERS_ENABLED:true}
  bootstrap-meter-data:
    enabled: ${BOOTSTRAP_METER_DATA_ENABLED:true}
  reports:
    latest-readings:
      # Cron cannot express an exact 14-day interval; this default runs twice per calendar month.
      cron: ${LATEST_READINGS_REPORT_CRON:0 0 9 1,15 * *}
      zone: ${LATEST_READINGS_REPORT_ZONE:Europe/Moscow}
      recipient: ${LATEST_READINGS_REPORT_RECIPIENT:user@example.com}
      sender: ${LATEST_READINGS_REPORT_SENDER:no-reply@provision.local}
